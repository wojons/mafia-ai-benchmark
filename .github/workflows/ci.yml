name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - packages/shared
          - apps/cli
          - apps/server
          - apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      - name: Run tests (${{ matrix.package }})
        run: |
          echo "=== Matrix package: ${{ matrix.package }} ==="
          echo "PWD: $(pwd)"
          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"

          cd ${{ matrix.package }}
          echo "CWD after cd: $(pwd)"

          # For apps/server: start server in background (via tsx from source), wait, run tests, cleanup
          if [ "${{ matrix.package }}" = "apps/server" ]; then
            mkdir -p data
            echo "Starting server via pnpm exec tsx..."
            pnpm exec tsx src/index.ts > server-ci.log 2>&1 &
            SERVER_PID=$!
            echo "Server PID: $SERVER_PID"

            # Wait for server to be ready (up to 60s)
            SERVER_READY=false
            for i in $(seq 1 60); do
              if curl -s http://localhost:3004/health > /dev/null 2>&1; then
                echo "Server ready after ${i}s"
                SERVER_READY=true
                break
              fi
              sleep 1
            done

            if [ "$SERVER_READY" != "true" ]; then
              echo "ERROR: Server failed to start within 60s"
              kill $SERVER_PID 2>/dev/null || true
              echo "=== Server log ==="
              cat server-ci.log 2>/dev/null || echo "(no log)"
              echo "=== Process list ==="
              ps aux | grep node | head -5 || true
              exit 1
            fi
          fi

          # Run tests
          echo "Running vitest..."
          # The suite's BASE_URL default and the source server's direct-run
          # default are both :3004 (compose host port; MAF-GAP-052), so CI's
          # own source server and the tests agree on :3004.
          if [ "${{ matrix.package }}" = "apps/server" ]; then
            export TEST_BASE_URL=http://localhost:3004
          fi
          npx vitest run
          TEST_EXIT=$?
          echo "vitest exit code: $TEST_EXIT"

          # Cleanup: kill server if we started one
          if [ "${{ matrix.package }}" = "apps/server" ]; then
            kill $SERVER_PID 2>/dev/null || true
            wait $SERVER_PID 2>/dev/null || true
            echo "Server cleaned up"
          fi

          exit $TEST_EXIT

  lint:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace (needed for dist/ type declarations)
        run: pnpm run build

      - name: Type check all packages
        run: |
          cd packages/shared && npx tsc --noEmit
          cd ../../apps/cli && npx tsc --noEmit
          cd ../server && npx tsc --noEmit
          cd ../web && npx tsc --noEmit
