name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - packages/shared
          - apps/cli
          - apps/server
          - apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      - name: Start server (apps/server only)
        if: matrix.package == 'apps/server'
        run: |
          cd apps/server
          npx tsx src/index.ts &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          # Wait for server to be ready (up to 30s)
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/health > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run tests (${{ matrix.package }})
        run: cd ${{ matrix.package }} && npx vitest run

      - name: Stop server (apps/server only)
        if: matrix.package == 'apps/server' && env.SERVER_PID != ''
        run: kill $SERVER_PID 2>/dev/null || true

  lint:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check all packages
        run: |
          cd packages/shared && npx tsc --noEmit
          cd ../../apps/cli && npx tsc --noEmit
          cd ../server && npx tsc --noEmit
          cd ../web && npx tsc --noEmit
