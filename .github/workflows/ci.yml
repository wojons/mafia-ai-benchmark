name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - packages/shared
          - apps/cli
          - apps/server
          - apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm run build

      - name: Run tests (${{ matrix.package }})
        run: |
          cd ${{ matrix.package }}

          # For apps/server: start server in background, wait for health, run tests, cleanup
          if [ "${{ matrix.package }}" = "apps/server" ]; then
            mkdir -p data
            nohup npx tsx src/index.ts > server-ci.log 2>&1 &
            SERVER_PID=$!
            echo "Server PID: $SERVER_PID"

            # Wait for server to be ready (up to 60s)
            SERVER_READY=false
            for i in $(seq 1 60); do
              if curl -s http://localhost:3000/health > /dev/null 2>&1; then
                echo "Server ready after ${i}s"
                SERVER_READY=true
                break
              fi
              sleep 1
            done

            if [ "$SERVER_READY" != "true" ]; then
              echo "ERROR: Server failed to start within 60s"
              kill $SERVER_PID 2>/dev/null || true
              cat server-ci.log 2>/dev/null
              exit 1
            fi
          fi

          # Run tests
          npx vitest run
          TEST_EXIT=$?

          # Cleanup: kill server if we started one
          if [ "${{ matrix.package }}" = "apps/server" ]; then
            kill $SERVER_PID 2>/dev/null || true
            wait $SERVER_PID 2>/dev/null || true
          fi

          exit $TEST_EXIT

  lint:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check all packages
        run: |
          cd packages/shared && npx tsc --noEmit
          cd ../../apps/cli && npx tsc --noEmit
          cd ../server && npx tsc --noEmit
          cd ../web && npx tsc --noEmit
