packages:
  - "packages/*"
  - "apps/*"

overrides:
  path-to-regexp: ">=0.1.12 <0.2.0"
  socket.io-parser: ">=4.2.6"
  ws: ">=8.21.0"
  qs: ">=6.15.2"
  uuid: ">=11.1.1"

allowBuilds:
  better-sqlite3: true
  esbuild: true

onlyBuiltDependencies:
  - esbuild
  - better-sqlite3

# Non-TTY safety (DF-27): pnpm 11 aborts with ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY
# when a pre-run dependency check decides node_modules must be re-provisioned (stale or
# symlinked node_modules — the normal state in cron/CI/worktrees) and cannot ask for
# confirmation. false = proceed non-interactively, exactly like CI=true.
confirmModulesPurge: false
