# GitReins Configuration — Mafia AI Benchmark
# TypeScript/pnpm monorepo. Tests run via Docker vitest inside server container.
guards:
  test_mode: diff
  secrets: true
  lint: true
  tests: true
  test_command: cd apps/server && npx vitest run
  lsp: true
  lsp_tools:
  - ts-lsp
  static_analysis: false
evaluator:
  max_iterations: 100
  max_time: 30m
  max_input_tokens: 1M
  max_output_tokens: 2M
  tool_call_weight: 0.1
  fast_track: auto

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: true
  storage: git
  max_verdicts: 1000
