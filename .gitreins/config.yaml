guards:
  test_mode: diff
  secrets: true
  lint: true
  tests: true
  test_command: cd apps/server && TEST_BASE_URL=http://localhost:3004 npx vitest run
  lsp: true
  lsp_tools:
  - ts-lsp
  static_analysis: false
  allow_skips: true
evaluator:
  max_iterations: 200
  max_time: 30m
  max_input_tokens: 4M
  max_output_tokens: 2M
  tool_call_weight: 0.1
  fast_track: auto
defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY
history:
  enabled: true
  storage: git
  max_verdicts: 1000
worktree_fleet:
  disk_ceiling_mb: 4096
resolution:
  enabled:
    cli: false
    mcp: false
    predispatch: false
    judge_prescreen: false
  model: typesafe/jev-1.13
  tokens_max: 28000
  bands:
    resolved_at: 0.85
    review_at: 0.5
  egress_exclude: []
