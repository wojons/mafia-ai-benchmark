# GitReins Configuration — Mafia AI Benchmark
# TypeScript/pnpm monorepo. apps/server api.test.ts hits a LIVE server:
# host :3000 is DuckBrain's HTTP server on fleet hosts, so point the guard's
# test run at the compose server exposed on :3004 (docker "3004:3000").
guards:
  test_mode: diff
  secrets: true
  lint: true
  tests: true
  test_command: cd apps/server && TEST_BASE_URL=http://localhost:3004 npx vitest run
  lsp: true
  lsp_tools:
  - ts-lsp
  static_analysis: false
evaluator:
  max_iterations: 100
  max_time: 30m
  max_input_tokens: 4M
  max_output_tokens: 2M
  tool_call_weight: 0.1
  fast_track: auto

defaults:
  model: deepseek-v4-flash
  provider: deepseek-foreman
  api_key_env: GITREINS_LLM_API_KEY

history:
  enabled: true
  storage: git
  max_verdicts: 1000
