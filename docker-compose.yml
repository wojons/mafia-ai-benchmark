services:
  # ============================================================================
  # Server — REST API + WebSocket (both on internal :3000, WS at /ws).
  # Host access: API via http://localhost:5174/api/v1 (nginx proxy) or directly
  # on :3004. Host :3000 is owned by the DuckBrain HTTP daemon (fleet service) —
  # do NOT map server to host :3000.
  # ============================================================================
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "3004:3000"
    env_file:
      - .env
    environment:
      # Container-internal port stays 3000 regardless of .env PORT (which may
      # be 3004 for direct runs on hosts where :3000 is DuckBrain's).
      PORT: "3000"
    volumes:
      - data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Web UI — Vite + Nginx serving on :5173
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Route API/WS through the nginx proxy — no hardcoded localhost:3000
        # (host :3000 is owned by the DuckBrain HTTP daemon).
        VITE_API_URL: /api/v1
        VITE_WS_URL: /ws
    ports:
      - "5174:5173"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
    driver: local
