services:
  # ============================================================================
  # Server — REST API (:3000) + WebSocket (:3001)
  # ============================================================================
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Web UI — Vite + Nginx serving on :5173
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5174:5173"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
    driver: local
